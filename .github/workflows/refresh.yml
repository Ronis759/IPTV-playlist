name: Обновление плейлиста

# Проверяет каналы и заменяет отвалившиеся. Запускается раз в сутки (05:17 UTC = 08:17 МСК)
# и вручную кнопкой «Run workflow».
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-playlist
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Проверка и замена каналов
        run: node scripts/refresh.mjs

      - name: Проверка синтаксиса M3U
        run: node scripts/validate.mjs

      - name: Коммит изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Автообновление плейлиста $(date -u +%Y-%m-%d)"
            git push
          fi
